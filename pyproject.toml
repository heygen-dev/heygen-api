[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heygen-api"
version = "0.1.0"
description = "Python client for the HeyGen API: Avatar 4 photo-to-talking-avatar video via a hosted endpoint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "heygen-dev"}]
keywords = ["ai api", "avatar-4", "fabric-1.0", "heygen", "heygen api", "heygen python", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/heygen-dev/heygen-api"
Documentation = "https://heygen-dev.github.io/heygen-api/"
"Hosted model" = "https://synexa.ai/explore/heygen/avatar-4?utm_source=github&utm_medium=ugc&utm_campaign=heygen-dev&utm_content=pyproject&utm_term=tier-c"

[tool.setuptools.packages.find]
include = ["heygen_api*"]
